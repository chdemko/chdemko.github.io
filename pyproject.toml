[tool.hatch.envs.default]
dependencies = [
  "Sphinx~=9.1",
  "shibuya~=2026.7.12",
  "myst-parser~=5.1",
  "sphinx-design~=0.7",
  "sphinxcontrib-bibtex~=2.7",
]

[tool.hatch.envs.default.scripts]
build = "sphinx-build src {args:build/sphinx/html}"
serve = "python -m http.server --directory {args:build/sphinx/html}"

