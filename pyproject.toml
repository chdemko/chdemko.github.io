[tool.hatch.envs.default]
dependencies = [
  "Sphinx~=9.2",
  "shibuya~=2026.7.12",
  "myst-parser~=5.2",
  "sphinx-design~=0.8",
  "sphinxcontrib-bibtex~=2.7",
  "pybtex~=0.26"
]

[tool.hatch.envs.default.scripts]
build = [
  "env SITE_LANGUAGE=en sphinx-build -W -c src src/en {args:build/sphinx/html}/en",
  "env SITE_LANGUAGE=fr sphinx-build -W -c src src/fr {args:build/sphinx/html}/fr",
  "env SITE_ROOT=1 sphinx-build -W -c src src {args:build/sphinx/html}",
]
serve = "python -m http.server --directory {args:build/sphinx/html}"
