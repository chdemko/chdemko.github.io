[tool.hatch.envs.default]
dependencies = [
  "Sphinx~=9.1",
  "shibuya~=2026.7",
  "myst-parser~=5.1",
  "ablog~=0.11",
  "sphinx-design~=0.7",
  "sphinxcontrib-mermaid~=2.0",
  "sphinxcontrib-plantuml~=0.31",
  "sphinxcontrib-bibtex~=2.7",
  "sphinx_last_updated_by_git~=0.3",
]

[tool.hatch.envs.default.scripts]
build = "sphinx-build src {args:build/sphinx/html}"
serve = "python -m http.server --directory {args:build/sphinx/html}"

