image: python:3.14

variables:
  PIPX_HOME: ${CI_PROJECT_DIR}/.cache/share/pipx
  PIPX_BIN_DIR: ${CI_PROJECT_DIR}/.cache/bin
  PIPX_MAN_DIR: ${CI_PROJECT_DIR}/.cache/share/man

before_script:
  - export PATH="$PIPX_BIN_DIR:$PATH"
  - pip install pipx
  - pipx install hatch==1.18.1

test:
  stage: test
  tags:
    - pagelab
  script:
  - hatch run build -- test
  artifacts:
    paths:
    - test
  rules:
    - if: $CI_COMMIT_REF_NAME != "main"

pages:
  stage: deploy
  tags:
    - pagelab
  script:
  - hatch run build -- public
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"

mirror:
  stage: deploy
  before_script: []
  script:
  - git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/chdemko/chdemko.github.io.git" "HEAD:refs/heads/${CI_COMMIT_REF_NAME}"
  rules:
    - if: $CI_COMMIT_REF_NAME == "main" || $CI_COMMIT_REF_NAME == "develop"

