image: python:3.14

before_script:
  - pip install pipx
  - pipx install hatch==1.17.1

test:
  stage: test
  tags:
    - pagelab
  script:
  - hatch run build test
  artifacts:
    paths:
    - test
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  tags:
    - pagelab
  script:
  - hatch run build public
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
